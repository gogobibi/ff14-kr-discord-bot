services:
  bot:
    build: .
    image: ff14-kr-discord-bot:latest
    container_name: ff14-kr-discord-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    # outbound only — ingress port 없음 (Discord WebSocket + 외부 fetch)
    # 다른 봇을 같은 호스트에 추가할 때도 각자 자기 디렉토리·자기 compose.yaml·자기 .env 로 분리해서 운영.
